# Restaurant configuration for the Restopolis menu collector.
#
# Every id below was verified against the live site (the two campus restaurants on
# 2026-09-23, LTC-K on 2026-10-03) by:
#   1. Loading https://ssl.education.lu/eRestauration/CustomerServices/Menu
#   2. Finding the restaurant's link in the restaurant picker, e.g.
#      <a class="restaurant-name" data-site="30354"
#         href="/eRestauration/CustomerServices/Menu/BtnChangeRestaurant?pRestaurantSelection=164">
#         UDL-CKB - Altius - Restaurant</a>
#      -> restaurant_id is the `pRestaurantSelection` query value.
#   3. Selecting the restaurant and reading the
#      CustomerServices.Restopolis.SelectedService cookie that the server
#      sets, and the `data-service-id` attribute on the (single) service tab
#      -> service_id.
#
# Run `python scraper.py discover` to re-verify these values against the
# live site if Restopolis ever renumbers a restaurant.

restaurants:
  - code: UDL-CKB-ALTIUS
    name: "UDL-CKB - Altius - Restaurant"
    site_name: "Université de Luxembourg Campus Kirchberg"
    site_id: 30354
    restaurant_id: 164
    service_id: 1183
    # Which Kirchberg campus building this restaurant is in -- NOT a
    # Restopolis field (see restopolis/models.py's RestaurantConfig.building
    # docstring), confirmed directly by the user (2026-09-23), not scraped.
    building: "Main building"

  - code: UDL-CKB-BRASSERIE-JOHNS
    name: "UDL-CKB - Brasserie John's - Restaurant"
    site_name: "Université de Luxembourg Campus Kirchberg"
    site_id: 30354
    restaurant_id: 160
    service_id: 178
    building: "JFK building"

  # Restopolis lists this one as "Lycée technique du Centre - Annexe Kirchberg" (site 64); its
  # restaurant is "LTC-K - Restaurant". Ids read from the live site on 2026-10-03: the restaurant
  # picker link gives pRestaurantSelection=36, and selecting it sets the SelectedService cookie to
  # 62 (its one service tab is "Service 11:00 - 15:00"). Same page structure as the campus
  # restaurants -- a daily "Menu" plus the shared "Constant products" -- with one extra daily
  # category, "Pasta".
  - code: LTC-K
    name: "LTC-K - Restaurant"
    site_name: "Lycée technique du Centre - Annexe Kirchberg"
    site_id: 64
    restaurant_id: 36
    service_id: 62
    building: "Annexe Kirchberg"
    display_name: "Lycée Technique du Centre"
    kind: school

  # Food House at Campus Belval -- the winner of the "which restaurant opens first" vote (closed
  # 2026-10-20, 19 of 50 votes). Ids read from the live site on 2026-10-21: the restaurant picker
  # link gives pRestaurantSelection=147 (site 31394), and selecting it sets the SelectedService
  # cookie to 53 (its one service tab is "Service 11:00 - 16:00"). Same page structure as the
  # others -- daily "Menu" (with Pasta) plus the shared "Constant products". The app lists it from
  # opens_on; its menus are collected from now on, so Monday 2 November is ready on the 1st.
  - code: UDL-CBV-FH
    name: "UDL-CBV-FH - Restaurant Food House"
    site_name: "Université de Luxembourg Campus Belval Food House"
    site_id: 31394
    restaurant_id: 147
    service_id: 53
    building: "Maison du Savoir"
    display_name: "Food House"
    campus: belval
    opens_on: 2026-11-01
