# Keeps UniResto responsive when the shared server runs low on memory: the kernel reclaims (swaps out) other
# programs' memory before UniResto's, and UniResto is the last candidate if the out-of-memory killer ever runs.
# Install:  cp scripts/systemd/uniresto-memory.conf /etc/systemd/system/uniresto.service.d/memory.conf
#           systemctl daemon-reload && systemctl restart uniresto.service   (a restart, not a HUP, applies it)
[Service]
MemoryLow=250M
OOMScoreAdjust=-500
