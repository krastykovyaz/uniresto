# Drop-in for uniresto.service:  /etc/systemd/system/uniresto.service.d/hardening.conf
#   install -D -m 644 scripts/systemd/uniresto-hardening.conf /etc/systemd/system/uniresto.service.d/hardening.conf
#   systemctl daemon-reload && systemctl restart uniresto.service      (a restart, not a HUP, applies it)
#
# The app still runs as root (it lives under /root, so a dedicated user needs the whole tree moved first); this only
# takes away what a compromised worker could otherwise do with that: gain more privileges, write to the system
# directories, touch the kernel, or leave world-readable files behind. ProtectHome is NOT set -- the app is in /root.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=full
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
# New files (uploaded photos, the sweep lock, WAL files) are private to the service user
UMask=0077
