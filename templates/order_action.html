<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UniResto</title>
    <style>
        :root { --green: #1aa860; --bg: #f7f8fa; --text: #14171a; --muted: #6b7280; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        .card { max-width: 420px; margin: 48px auto; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .header { background: var(--green); color: #fff; padding: 20px 28px; font-weight: 700; font-size: 18px; }
        .body { padding: 28px; text-align: center; }
        .icon { font-size: 40px; margin-bottom: 12px; }
        h1 { font-size: 18px; margin: 0 0 8px; }
        p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">UniResto</div>
        <div class="body">
            <div class="icon">{{ icon }}</div>
            <h1>{{ title }}</h1>
            <p>{{ message }}</p>
        </div>
    </div>
</body>
</html>
